<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RNA Forge">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/hero/selected/home-hero-rna-forge-flow.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' {{ site.contact_form_endpoint }}; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; img-src 'self' data:; style-src 'self'; font-src 'self'; upgrade-insecure-requests">
  <link rel="icon" type="image/png" href="{{ '/assets/logos/rna-forge-logo-standard-colour.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/vag-rounded-next-regular.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/vag-rounded-next-semibold.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/vag-rounded-next-bold.otf' | relative_url }}" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v=20260827-2">
  {% if page.turnstile %}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endif %}
</head>
