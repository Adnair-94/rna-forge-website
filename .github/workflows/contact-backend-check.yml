name: Contact backend checks

on:
  pull_request:
    paths:
      - "contact-worker/**"
      - ".github/workflows/*contact*.yml"
  push:
    branches: [main]
    paths:
      - "contact-worker/**"
      - ".github/workflows/*contact*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Validate site
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate existing pages and backend-only change scope
        env:
          SITE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python contact-worker/test/validate_site.py
  test:
    name: Test contact backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test worker without live credentials
        run: npm test --prefix contact-worker
      - name: Install locked deployment tooling without lifecycle scripts
        run: npm ci --ignore-scripts --prefix contact-worker
      - name: Audit deployment dependencies
        run: npm audit --audit-level=low --prefix contact-worker
      - name: Validate production and staging bundles without deploying
        working-directory: contact-worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/contact-production-bundle"
          npx --no-install wrangler deploy --dry-run --config wrangler.staging.toml --outdir "$RUNNER_TEMP/contact-staging-bundle"

