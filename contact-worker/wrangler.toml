name = "rna-forge-contact"
main = "src/index.js"
compatibility_date = "2026-08-26"
workers_dev = false
preview_urls = false
routes = [{ pattern = "contact.rnaforge.com", custom_domain = true, zone_id = "aaec8cdb32202c0028dc008713617a59" }]

[vars]
ALLOWED_HOSTNAMES = "rnaforge.com,www.rnaforge.com"
ALLOWED_ORIGINS = "https://rnaforge.com,https://www.rnaforge.com"
CONTACT_DELIVERY_ENABLED = "true"
CONTACT_TEST_MODE = "false"
SITE_ORIGIN = "https://rnaforge.com"

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "26082601"

  [ratelimits.simple]
  limit = 5
  period = 60

[observability.logs]
enabled = true
